<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saanvi Motors Attendance</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f6fa;

.container {

<body>

<div class="container">

<div class="header">
    <h1>SAANVI MOTORS</h1>
    <p>Employee Attendance System</p>
</div>

<div class="card">

<div class="tabs">
    <button class="tab active" onclick="showEmployee()">EMPLOYEE</button>
    <button class="tab" onclick="showAdmin()">ADMIN</button>
</div>


<!-- EMPLOYEE PANEL -->

<div id="employeePanel">

<label>Select Employee</label>

<select id="employee">

<option value="Rohit Kumar">Rohit Kumar</option>
<option value="Abhishek Raj">Abhishek Raj</option>
<option value="Gudiya Kumari">Gudiya Kumari</option>
<option value="Farukh Alam">Farukh Alam</option>
<option value="Neyaj Alam">Neyaj Alam</option>
<option value="Sipahi Kumar">Sipahi Kumar</option>
<option value="Chunnu Kumar">Chunnu Kumar</option>

</select>

<div class="date-time">

<strong id="date"></strong>

<span id="time"></span>

</div>

<div class="buttons">

<button class="mark-in" onclick="markIn()">
🟢 MARK IN
</button>

<button class="mark-out" onclick="markOut()">
🔴 MARK OUT
</button>

</div>

<div class="status" id="status">
Today's attendance has not been marked.
</div>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel" class="hidden">

<label>Admin Password</label>

<input
type="password"
id="adminPassword"
placeholder="Enter password">

<button class="admin-btn" onclick="loginAdmin()">
ADMIN LOGIN
</button>


<div id="adminArea" class="hidden">

<div class="admin-header">

<h2>Today's Attendance</h2>

<button class="export" onclick="exportCSV()">
EXPORT
</button>

</div>

<p id="summary"></p>

<table>

<thead>

<tr>
<th>Employee</th>
<th>IN</th>
<th>OUT</th>
</tr>

</thead>

<tbody id="attendanceTable">
</tbody>

</table>

</div>

</div>

</div>

<div class="footer">
Saanvi Motors • Attendance System
</div>

</div>


<script>

const employees = [
"Rohit Kumar",
"Abhishek Raj",
"Gudiya Kumari",
"Farukh Alam",
"Neyaj Alam",
"Sipahi Kumar",
"Chunnu Kumar"
];

/*
CHANGE THIS PASSWORD
*/

const ADMIN_PASSWORD = "saanvi123";

const STORAGE_KEY = "saanvi_attendance";


function todayKey() {

    const d = new Date();

    return d.getFullYear() + "-" +
           String(d.getMonth()+1).padStart(2,"0") + "-" +
           String(d.getDate()).padStart(2,"0");

}


function getData() {

    return JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "{}"
    );

}


function saveData(data) {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


function currentTime() {

    return new Date().toLocaleTimeString(
        "en-IN",
        {
            hour: "2-digit",
            minute: "2-digit",
            hour12: true
        }
    );

}


function updateClock() {

    const d = new Date();

    document.getElementById("date").innerText =
        d.toLocaleDateString("en-IN");

    document.getElementById("time").innerText =
        currentTime();

}


setInterval(updateClock,1000);

updateClock();


function markIn() {

    const name = document.getElementById("employee").value;

    if (!navigator.geolocation) {
        alert("Aapke device me location support nahi hai.");
        return;
    }

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            const data = getData();
            const date = todayKey();

            if (!data[date]) {
                data[date] = {};
            }

            if (!data[date][name]) {
                data[date][name] = {};
            }

            if (data[date][name].in) {
                alert("IN already marked for today.");
                return;
            }

            data[date][name].in = currentTime();

            data[date][name].location = {
                latitude: latitude,
                longitude: longitude,
                accuracy: accuracy
            };

            saveData(data);

            showStatus();

            alert(
                "IN successfully marked!\n\n" +
                "Location captured successfully."
            );
        },

        function(error) {

            alert(
                "Location nahi mil pa rahi hai.\n\n" +
                "Please Location/GPS ON karein aur browser me Allow dabayein."
            );

        },

        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }

    );
}

    const name =
        document.getElementById("employee").value;

    const data = getData();

    const date = todayKey();

    if(!data[date]) {

        data[date] = {};

    }

    if(!data[date][name]) {

        data[date][name] = {};

    }

    if(data[date][name].in) {

        alert("IN already marked for today.");

        return;

    }

    data[date][name].in = currentTime();

    saveData(data);

    showStatus();

}


function markOut() {

    const name =
        document.getElementById("employee").value;

    const data = getData();

    const date = todayKey();

    if(!data[date]) {

        data[date] = {};

    }

    if(!data[date][name]) {

        data[date][name] = {};

    }

    if(!data[date][name].in) {

        alert("Please MARK IN first.");

        return;

    }

    if(data[date][name].out) {

        alert("OUT already marked for today.");

        return;

    }

    data[date][name].out = currentTime();

    saveData(data);

    showStatus();

}


function showStatus() {

    const name =
        document.getElementById("employee").value;

    const data = getData();

    const date = todayKey();

    const record =
        data[date]?.[name];

    if(!record) {

        document.getElementById("status").innerHTML =
            "Today's attendance has not been marked.";

        return;

    }

    document.getElementById("status").innerHTML =

        "Employee: <b>" + name + "</b><br>" +

        "IN: <b>" + (record.in || "—") + "</b><br>" +

        "OUT: <b>" + (record.out || "—") + "</b>";

}


document
.getElementById("employee")
.addEventListener("change",showStatus);


function showEmployee() {

    document
    .getElementById("employeePanel")
    .classList.remove("hidden");

    document
    .getElementById("adminPanel")
    .classList.add("hidden");

}


function showAdmin() {

    document
    .getElementById("employeePanel")
    .classList.add("hidden");

    document
    .getElementById("adminPanel")
    .classList.remove("hidden");

}


function loginAdmin() {

    const password =
        document.getElementById("adminPassword").value;

    if(password !== ADMIN_PASSWORD) {

        alert("Wrong password.");

        return;

    }

    document
    .getElementById("adminArea")
    .classList.remove("hidden");

    loadAdmin();

}


function loadAdmin() {

    const data = getData();

    const date = todayKey();

    const today = data[date] || {};

    const table =
        document.getElementById("attendanceTable");

    table.innerHTML = "";

    let present = 0;

    employees.forEach(name => {

        const record =
            today[name] || {};

        if(record.in) {

            present++;

        }

        const row =
            document.createElement("tr");

        row.innerHTML =

            "<td>" + name + "</td>" +

            "<td>" + (record.in || "—") + "</td>" +

            "<td>" + (record.out || "—") + "</td>";

        table.appendChild(row);

    });

    document.getElementById("summary").innerText =

        "Present: " +
        present +
        " / " +
        employees.length;

}


function exportCSV() {

    const data = getData();

    const date = todayKey();

    const today = data[date] || {};

    let csv =
        "Employee,IN,OUT\n";

    employees.forEach(name => {

        const record =
            today[name] || {};

        csv +=
            '"' + name + '",' +
            '"' + (record.in || "") + '",' +
            '"' + (record.out || "") + '"\n';

    });

    const blob =
        new Blob([csv], {type:"text/csv"});

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "Saanvi-Motors-Attendance-" +
        date +
        ".csv";

    a.click();

    URL.revokeObjectURL(url);

}

</script>

</body>
</html>
