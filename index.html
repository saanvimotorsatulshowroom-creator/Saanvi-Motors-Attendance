<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saanvi Motors Attendance</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>SAANVI MOTORS</h1>
        <p>Employee Attendance System</p>
    </div>

    <div class="card">

        <div class="tabs">
            <button class="tab active" onclick="showEmployee()">
                EMPLOYEE
            </button>

            <button class="tab" onclick="showAdmin()">
                ADMIN
            </button>
        </div>


        <!-- ================= EMPLOYEE ================= -->

        <div id="employeePanel">

            <!-- LOGIN -->

            <div id="employeeLogin">

                <label>Employee ID</label>

                <input
                    type="text"
                    id="employeeCode"
                    placeholder="Enter Employee ID"
                    autocomplete="off"
                >

                <label>PIN</label>

                <input
                    type="password"
                    id="employeePin"
                    placeholder="Enter PIN"
                    inputmode="numeric"
                >

                <button
                    class="admin-btn"
                    onclick="employeeLogin()">

                    EMPLOYEE LOGIN

                </button>

            </div>


            <!-- LOGGED IN EMPLOYEE -->

            <div id="employeeArea" class="hidden">

                <h2 id="employeeName"></h2>

                <p id="employeeCodeDisplay"></p>


                <div class="date-time">

                    <strong id="date"></strong>

                    <span id="time"></span>

                </div>


                <div class="buttons">

                    <button
                        class="mark-in"
                        onclick="markIn()">

                        🟢 MARK IN

                    </button>


                    <button
                        class="mark-out"
                        onclick="markOut()">

                        🔴 MARK OUT

                    </button>

                </div>


                <div
                    class="status"
                    id="status">

                    Aaj attendance mark nahi hui.

                </div>


                <button
                    class="admin-btn"
                    onclick="employeeLogout()">

                    LOGOUT

                </button>

            </div>

        </div>


        <!-- ================= ADMIN ================= -->

        <div id="adminPanel" class="hidden">

            <div id="adminLoginArea">

                <label>Admin Password</label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter password"
                >

                <button
                    class="admin-btn"
                    onclick="loginAdmin()">

                    ADMIN LOGIN

                </button>

            </div>


            <div id="adminArea" class="hidden">

                <div class="admin-header">

                    <h2>Today's Attendance</h2>

                    <button
                        class="export"
                        onclick="exportCSV()">

                        EXPORT

                    </button>

                </div>


                <p id="summary"></p>


                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>Employee</th>

                                <th>IN</th>

                                <th>OUT</th>

                                <th>LOCATION</th>

                            </tr>

                        </thead>


                        <tbody id="attendanceTable"></tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <div class="footer">
        Saanvi Motors • Attendance System
    </div>

</div>


<script src="script.js"></script>

</body>
</html>
