<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Saanvi Motors Attendance</title>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>SAANVI MOTORS</h1>

        <p>Employee Attendance System</p>

    </div>



    <div class="card">


        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab active"
                onclick="showEmployee()">

                EMPLOYEE

            </button>


            <button
                class="tab"
                onclick="showAdmin()">

                ADMIN

            </button>

        </div>



        <!-- =========================
             EMPLOYEE
        ========================== -->

        <div id="employeePanel">


            <label>Select Employee</label>


            <select
                id="employee"
                onchange="showStatus()">

                <option value="Rohit Kumar">
                    Rohit Kumar
                </option>

                <option value="Abhishek Raj">
                    Abhishek Raj
                </option>

                <option value="Gudiya Kumari">
                    Gudiya Kumari
                </option>

                <option value="Farukh Alam">
                    Farukh Alam
                </option>

                <option value="Neyaj Alam">
                    Neyaj Alam
                </option>

                <option value="Sipahi Kumar">
                    Sipahi Kumar
                </option>

                <option value="Chunnu Kumar">
                    Chunnu Kumar
                </option>

            </select>



            <!-- DATE & TIME -->

            <div class="date-time">

                <strong id="date"></strong>

                <span id="time"></span>

            </div>



            <!-- BUTTONS -->

            <div class="buttons">


                <button
                    class="mark-in"
                    onclick="markIn()">

                    🟢 MARK IN

                </button>


                <button
                    class="mark-out"
                    onclick="markOut()">

                    🔴 MARK OUT

                </button>


            </div>



            <!-- STATUS -->

            <div
                class="status"
                id="status">

                Aaj attendance mark nahi hui.

            </div>


        </div>



        <!-- =========================
             ADMIN
        ========================== -->

        <div
            id="adminPanel"
            class="hidden">


            <label>
                Admin Password
            </label>


            <input
                type="password"
                id="adminPassword"
                placeholder="Enter password">


            <button
                class="admin-btn"
                onclick="loginAdmin()">

                ADMIN LOGIN

            </button>



            <!-- ADMIN AREA -->

            <div
                id="adminArea"
                class="hidden">


                <div class="admin-header">


                    <h2>
                        Today's Attendance
                    </h2>


                    <button
                        class="export"
                        onclick="exportCSV()">

                        EXPORT

                    </button>


                </div>



                <!-- SUMMARY -->

                <p id="summary"></p>



                <!-- ATTENDANCE TABLE -->

                <div class="table-container">

                    <table>


                        <thead>

                            <tr>

                                <th>
                                    Employee
                                </th>


                                <th>
                                    IN
                                </th>


                                <th>
                                    OUT
                                </th>


                                <th>
                                    LOCATION
                                </th>

                            </tr>

                        </thead>



                        <tbody
                            id="attendanceTable">

                        </tbody>


                    </table>

                </div>


            </div>


        </div>


    </div>



    <!-- FOOTER -->

    <div class="footer">

        Saanvi Motors • Attendance System

    </div>


</div>



<!-- JAVASCRIPT -->

<script src="script.js"></script>


</body>

</html>
